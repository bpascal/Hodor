buildscript {
    ext {
        springBootVersion = '2.7.18'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

group 'com.codido'
version '1.0-SNAPSHOT'


apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

//排除tomcat配置
configurations {
    implementation.exclude module: "spring-boot-starter-tomcat"
}

dependencies {
    implementation project(':Hodor-core')

    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation("org.springframework.boot:spring-boot-starter-jetty")
    implementation('org.springframework.boot:spring-boot-configuration-processor')
    implementation('org.springframework.boot:spring-boot-starter-aop')
    implementation('org.springframework.boot:spring-boot-starter-data-redis')

    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2')
    runtimeOnly('mysql:mysql-connector-java:8.0.33')
    implementation('com.alibaba:druid:1.2.20')

    implementation('com.alibaba:fastjson:1.2.83')
    implementation('com.google.code.gson:gson:2.10.1')

    implementation('com.github.binarywang:wx-java-mp-spring-boot-starter:3.7.0')
    implementation('com.github.binarywang:weixin-java-mp:3.7.0')

    implementation("org.apache.commons:commons-lang3:3.12.0")
    implementation("org.apache.httpcomponents:httpcore:4.4.16")
    implementation("org.apache.httpcomponents:httpclient:4.5.14")
    implementation("org.apache.httpcomponents:httpmime:4.5.14")
    implementation("com.thoughtworks.xstream:xstream:1.4.20")

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    testImplementation('org.springframework.boot:spring-boot-starter-test')
}
