buildscript {
    ext {
        springBootVersion = '2.7.18'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}


group 'com.codido'
version '1.0-SNAPSHOT'


apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
}

//排除tomcat配置
configurations {
    implementation.exclude module: "spring-boot-starter-tomcat"
}

dependencies {
    implementation project(':Hodor-core')

    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation("org.springframework.boot:spring-boot-starter-jetty")
    implementation('org.springframework.boot:spring-boot-configuration-processor')
    implementation('org.springframework.boot:spring-boot-starter-aop')
    implementation('org.springframework.boot:spring-boot-starter-data-redis')

    implementation('org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2')
    implementation('com.github.pagehelper:pagehelper-spring-boot-starter:1.4.7')
    runtimeOnly('mysql:mysql-connector-java:8.0.33')
    implementation('com.alibaba:druid:1.2.20')

    implementation('com.alibaba:fastjson:1.2.83')
    implementation('com.google.code.gson:gson:2.10.1')

    implementation('com.github.binarywang:weixin-java-mp:3.7.0')
    implementation('com.github.binarywang:weixin-java-pay:3.7.0')

    implementation('org.dom4j:dom4j:2.1.4')

    implementation('com.qiniu:qiniu-java-sdk:7.13.1')
    implementation('net.coobird:thumbnailator:0.4.20')

    implementation('log4j:log4j:1.2.17')

    implementation("org.apache.commons:commons-lang3:3.12.0")
    implementation("commons-io:commons-io:2.11.0")
    implementation("org.apache.httpcomponents:httpcore:4.4.16")
    implementation("org.apache.httpcomponents:httpclient:4.5.14")
    implementation("org.apache.httpcomponents:httpmime:4.5.14")
    implementation("com.thoughtworks.xstream:xstream:1.4.20")

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    implementation('io.springfox:springfox-boot-starter:3.0.0')
    implementation('com.github.xiaoymin:swagger-bootstrap-ui:1.9.6')
    implementation('com.github.caspar-chen:swagger-ui-layer:1.1.3')

    //通义千问AI
    implementation('com.alibaba:dashscope-sdk-java:2.16.10') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    testImplementation('org.springframework.boot:spring-boot-starter-test')
}
